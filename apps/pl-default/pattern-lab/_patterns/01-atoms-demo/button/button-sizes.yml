buttons_demo:
  title: 'Button Sizes and Styles'
  content:
    lead: '<strong>There are four button sizes available:</strong> 
    <ul>
      <li>Small: btn--small</li>
      <li>Medium: btn--medium</li>
      <li>Large: btn--large</li>
      <li>Extra Large: btn--extra-large</li>
    </ul>'

button_small:
  text: 'Small'
  color: 'btn--navy'
  size: 'btn--small'

button_medium:
  text: 'Medium'
  color: 'btn--navy'
  size: 'btn--medium'

button_large:
  text: 'Large'
  color: 'btn--navy'
  size: 'btn--large'
  
button_extralarge:
  text: 'Extra large'
  color: 'btn--navy'
  size: 'btn--extra-large'
buttons_demo:
  title: 'Button Colors'
  content:
    lead: '<strong>There are several button color options that can be used on light and dark backgrounds:</strong>
      <ul>
        <li>Navy: btn--navy</li>
        <li>Yellow: btn--yellow</li>
        <li>Green: btn--green</li>
        <li>Navy Outline: btn--navy-outline</li>
        <li>Burgundy: btn--burgundy</li>
        <li>Light Blue: btn--lightblue</li>
        <li>White Outline: btn--white-outline</li>
      </ul>'

button_navy:
  text: 'Navy Button'
  color: 'btn--navy'

button_yellow:
  text: 'Yellow Button'
  color: 'btn--yellow'

button_green:
  text: 'Green Button'
  color: 'btn--green'
  
button_navyoutline:
  text: 'Navy Outline Button'
  color: 'btn--navy-outline'

button_burgundy:
  text: 'Burgundy Button'
  color: 'btn--burgundy'

button_lightblue:
  text: 'Light Blue Button'
  color: 'btn--lightblue'

button_whiteoutline:
  text: 'White Outline Button'
  color: 'btn--white-outline'

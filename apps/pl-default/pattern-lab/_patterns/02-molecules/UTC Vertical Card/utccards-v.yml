utccard_demo:
  title: ''
  content:
    lead: 'Demonstration of our UTC Card Component'
    summary:
      'Provides a custom UTC card component utilizing Tailwind component as default. Card features can be mixed and matched and include the following: card color, card width, text alignment, card link or button link (see "Atoms" for button options), card image or icon (including icon color, size and border), and image fill or not (padded).'

utccard_1:
  card_image_select:
    variant: 'primary'
    src: ''
    alt: 'Graybox placeholder image'
    style: 'card'
    placeholder: true
  card_type: 'thumbnail'
  card_color: 'white'
  card_width: ''
  text_alignment: "left"
  card_link: false
  card_link_target: ""
  card_title: 'White, Left-Aligned'
  card_text:
    - '&#8226; white background'
    - '&#8226; solid blue button'
    - '&#8226; not a link itself'
    - '&#8226; horizontal image cropped'
    - '&#8226; left-aligned'
    - '&nbsp;'
    - 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.'
  card_button_text: 'Button Text'
  card_button_url: 'utc.edu'
  card_button_style: 'btn--navy'
  card_button_target: ''
  card_icon: false
  card_icon_color: ''
  card_icon_fa: ''
  card_icon_size: ''
  card_icon_border: false
  card_image:
    variant: 'primary'
    src: 'https://via.placeholder.com/900x600.jpeg'
    alt: 'Graybox placeholder image'
    style: 'card'
    placeholder: true
  card_img_fill: true

